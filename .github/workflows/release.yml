name: Release

# Push a tag like v0.1.1 to build signed APKs and publish a GitHub Release.
# Steps and required secrets/variables: docs/release-process.md
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_REVALIDATE_URL: ${{ vars.WEB_REVALIDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

      - name: Check configuration
        run: |
          # API_BASE_URL is compiled into the app; a non-https value would break update checks.
          dart run tool/release/config_check.dart "$API_BASE_URL"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANUVAAD_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANUVAAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANUVAAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANUVAAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL --dart-define=RELEASES_REPO=$GITHUB_REPOSITORY"
          # Keep every APK's versionCode equal to the pubspec build number (the updater compares it).
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $DEFINES
          mkdir -p build/release/apks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "build/release/apks/anuvaad-$VERSION-$abi.apk"
          done
          flutter build apk --release $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk "build/release/apks/anuvaad-$VERSION-universal.apk"

      - name: Check every APK (permissions and versionCode)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          for apk in build/release/apks/*.apk; do bash tool/release/check_apk.sh "$AAPT2" "$apk" "$BUILD"; done

      - name: Prepare release.json and notes
        run: dart run tool/release/prepare_release.dart --version "$VERSION" --apk-dir build/release/apks --out build/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/release/apks/*.apk build/release/release.json \
            --title "Anuvaad $VERSION" --notes-file build/release/notes.md

      - name: Refresh the website's release list
        if: env.WEB_REVALIDATE_URL != ''
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: curl -fsS -X POST -H "x-revalidate-secret: $REVALIDATE_SECRET" "$WEB_REVALIDATE_URL"
